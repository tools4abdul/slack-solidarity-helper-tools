name: VAN turf catalog sync

# Pulls VAN's map regions into van_turfs so the turf page has something to
# show. Every 30 minutes during waking hours: turf gets cut and printed lists
# get generated during the day, and a volunteer who cannot see turf an
# organizer just published has no way to know it exists.
#
# BACKUP ONLY since 2026-09-25: the app runs this on its own schedule
# (src/lib/server/scheduler.ts), because GitHub drops most scheduled runs — this
# one ran 5-7 times a day out of 37. Kept because a run that is not needed is a
# harmless no-op, and it still covers the app's scheduler being down or turned
# off (IN_APP_SCHEDULER=off). Change the times there as well as here.
#
# THE OVERNIGHT TICKS ARE NOT ABOUT THE CATALOG — do not trim them as waste.
# The same endpoint sends the six-hour turf expiry warning (Story 7.3), and a
# volunteer only gets that warning if a run happens inside the six hours before
# their claim lapses. This schedule used to stop at 03:07 and resume at 11:07,
# an eight-hour hole, so any claim expiring between 09:08 and 11:07 UTC was
# swept away without its holder ever being told. Hourly overnight closes it and
# leaves five hours of slack, so several missed runs in a row still warn in
# time.
#
# Rule of thumb for anyone editing this: no two consecutive runs may be more
# than six hours apart, and the tighter the better.
#
# Runs are idempotent — the endpoint upserts by mapRouteId and takes a
# sync_locks lock, so an overlapping or delayed run is a no-op rather than a
# double write. GitHub cron is best-effort and skipping one is harmless.
on:
  schedule:
    - cron: '7,37 11-23 * * *'
    - cron: '7 0-10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call VAN catalog sync endpoint
        env:
          APP_URL: https://slack.tools4abdul.com
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 300 \
            --retry 3 --retry-delay 30 --retry-connrefused \
            "${APP_URL}/api/internal/van-sync?key=${INTERNAL_CRON_SECRET}"
