name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete — except on
# main, where a run may be mid-deploy. Cancelling between the release_command
# (which runs migrations) and the machine rollout would leave the app half
# updated, so main runs are always allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches ARG NODE_VERSION in the Dockerfile, so CI runs what deploys run.
          node-version: '22.21.1'
          cache: 'npm'

      # `npm ci` on Linux matches how package-lock.json is expected to be
      # generated and fails loudly if it has drifted out of sync with
      # package.json.
      - name: Install
        id: install
        run: npm ci

      # No explicit `svelte-kit sync` step: the `prepare` script runs it, and npm
      # runs `prepare` automatically after `npm ci`. That generates
      # .svelte-kit/tsconfig.json (which tsconfig.json extends) plus the ambient
      # and $types declarations, none of which are committed.

      # Each check is gated on the install rather than on the previous check, so
      # one push reports every problem instead of only the first. Nothing runs if
      # the install itself failed, which would just produce four confusing errors.
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check .

      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint .

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      # The tests, with every statement they send planned as production's
      # planner would and checked for reads of a whole large table (see
      # scripts/plan-audit/run.ts). A failing test fails this step too.
      - name: Tests and query plans
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:plans

  deploy:
    # Gated on every check above. `needs` also means a failed or cancelled check
    # job skips the deploy rather than racing it.
    needs: check
    # Merging a PR into main produces a push to main, which is what this matches.
    # PR runs never reach here, so nothing deploys from an unmerged branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Serialize releases: two merges in quick succession queue rather than deploy
    # on top of each other. Deliberately NOT cancel-in-progress — an interrupted
    # deploy is worse than a delayed one when release_command runs migrations.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # fly.toml's release_command (`node bin/migrate.js`) runs before the new
      # machines take traffic. A failing migration aborts the release, so a bad
      # schema change stops the deploy instead of half-applying it.
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
