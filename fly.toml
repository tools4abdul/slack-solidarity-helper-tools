# fly.toml app configuration file generated for slack-solidarity-helper-tools on 2026-04-10T01:17:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'slack-solidarity-helper-tools'
primary_region = 'ord'

[build]

[env]
  # adapter-node defaults HOST to 0.0.0.0, which binds IPv4 only. fly-proxy
  # reaches machines over the private IPv6 network, so the health check on
  # internal_port could never connect. '::' binds the dual-stack wildcard,
  # accepting both IPv6 and IPv4-mapped connections.
  HOST = '::'

[deploy]
  release_command = 'node bin/migrate.js'

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine up at all times so the first request after an idle period
  # doesn't pay cold-start latency. Extra machines scaled up beyond the first
  # still stop when idle.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
